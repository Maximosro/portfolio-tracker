# GitLab Pages deployment (opcional)
# Publica docs/public/ como GitLab Pages, pero SOLO si esa carpeta existe en la rama.
# docs/public/ se eliminó del proyecto (ya no hay landing en docs/), así que el job
# no se crea y no se genera un pipeline fallido en cada push a la rama por defecto.
image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r docs/public/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - docs/public/index.html
